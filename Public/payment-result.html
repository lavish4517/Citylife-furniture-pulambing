<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment result | FurniMarket</title><link rel="stylesheet" href="/style.css"></head><body><main class="modalbox" style="margin:12vh auto"><h2>Checking your payment</h2><p id="result">Please wait while we verify the transaction.</p><a class="primary" href="/">Return to store</a></main><script>const p=new URLSearchParams(location.search);const ref=p.get('tx_ref');const token=localStorage.getItem('fm_token');const out=document.getElementById('result');if(!ref||!token){out.textContent='Payment reference or sign-in session is missing. Return to the store and check your order history.';}else{fetch('/api/payments/verify/'+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+token}}).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{out.textContent=ok?'Payment status: '+d.payment.status+'. Order #'+d.order.id+' — '+d.order.status+'.':(d.error||'Unable to verify payment.');}).catch(()=>out.textContent='Could not reach the server. Please try again.');}</script></body></html>
